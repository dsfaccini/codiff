allowBuilds:
  "@swc/core": true

minimumReleaseAgeExclude:
  - "@typescript/native-preview"
  - "@typescript/native-preview-*"

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.1.21
  vite-plus: 0.1.21
  vitest: npm:@voidzero-dev/vite-plus-test@0.1.21
onlyBuiltDependencies:
  - "@swc/core"
  - "@tailwindcss/oxide"
  - unrs-resolver
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
